<style>
/* Layout: Klasseneditor wie im Spiel – Leiste links, nummerierte Liste, Detailpanel rechts.
   Mobil: Liste füllt den Schirm, Detail schiebt sich darüber, Bereiche als Tabs unten.
   Bewusst nur ein dunkles Thema: es ist eine Spiel-Oberfläche. */
:root{
  color-scheme: dark;
  --bg:#0e1215; --bg-2:#141a1e; --glow:#1c252b;
  --panel:#192025; --panel-solid:#171d21; --panel-3:#252e35; --panel-a:rgba(24,31,36,.9);
  --line:rgba(214,226,218,.10); --line-2:rgba(214,226,218,.22);
  --text:#e7ebe4; --muted:#95a29b; --dim:#66746d; --sand:#e4d9bd;
  /* Nebenschrift unter den Werten: --dim kam auf --panel-solid nur auf 3,47:1, gleicher Farbton bis 4,51 aufgehellt */
  --sub:#78877f;
  --lime:#c8e03c; --lime-2:#dbec84; --lime-ink:#141a06;
  --gold:#f1b72c; --orange:#f07d24; --steel:#a9bfcc;
  --track:rgba(214,226,218,.08); --grid:rgba(214,226,218,.07); --hover:rgba(200,224,60,.07);
  --pip-off:rgba(214,226,218,.16); --ghost:rgba(231,235,228,.17); --hatch:rgba(214,226,218,.035);
  --orange-line:rgba(240,125,36,.5); --orange-bg:rgba(240,125,36,.08);
  --nav-bg:rgba(14,18,21,.96); --shadow:rgba(0,0,0,.55);
  --band:linear-gradient(90deg,rgba(200,224,60,.56) 0%,rgba(200,224,60,.22) 48%,rgba(200,224,60,0) 94%);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-ko:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --rail:84px; --nav-h:64px;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);background-image:radial-gradient(1200px 720px at 100% -15%,var(--glow) 0%,transparent 62%),linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 55%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--steel);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

/* Leiste */
.rail{grid-row:1 / span 2;display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:18px;border-right:1px solid var(--line)}
.badge{display:grid;justify-items:center;gap:3px}
.badge svg{width:62px;height:62px}
.badge .b-ring{fill:none;stroke:var(--line-2);stroke-width:1.5}
.badge .b-hex{fill:var(--sand)} .badge .b-in{fill:var(--bg-2)} .badge .b-star{fill:var(--orange)} .badge .b-dot{fill:var(--lime)}
.badge-label{font:600 13px/1 var(--f-display);letter-spacing:.14em;color:var(--lime-2)}
.badge-num{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.nav{display:flex;flex-direction:column;gap:6px;width:100%}
.nav a{display:grid;justify-items:center;gap:5px;padding:10px 2px;color:var(--sand);text-decoration:none;font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.nav a svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a svg .solid{fill:currentColor;stroke:none}
.nav a:hover{color:var(--lime-2)}
.nav a[aria-current="page"]{color:var(--lime);background:linear-gradient(90deg,rgba(200,224,60,.24),rgba(200,224,60,0))}

/* Kopfzeile */
.topbar{grid-column:2;display:flex;flex-direction:column;gap:12px;padding-block:14px;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:6px;font:400 13px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.03em}
.status > *{background:var(--panel-solid);border:1px solid var(--line);padding:7px 10px;white-space:nowrap}
.status b{font-weight:400;color:var(--lime-2)}
.status .warn{color:var(--orange);border-color:var(--orange-line)}
.status button{color:var(--lime-ink);background:var(--lime);border-color:var(--lime)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:7px;vertical-align:1px}
.is-offline .dot{background:var(--orange)}
.title-row{display:flex;align-items:baseline;gap:14px;min-width:0}
.title-row h1{margin:0;font:800 clamp(34px,4.6vw,62px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.ghost{font:800 clamp(24px,3.2vw,44px)/1 var(--f-ko);color:var(--ghost);white-space:nowrap;overflow:hidden}
.back{font:700 46px/.75 var(--f-display);color:var(--sand);padding:0 4px 0 0;align-self:center}
.back:hover{color:var(--lime)}

.main{grid-column:2;min-height:0;position:relative}
.pane,.page{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.split{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:24px;height:100%}
.list-pane{padding:2px 6px 28px 0}
.detail-pane{padding:2px 2px 28px}
.page{height:100%;padding-bottom:32px}
.page-inner{max-width:1180px;display:grid;gap:26px}

/* Liste */
.tools{display:grid;gap:10px;padding-bottom:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-solid);border:1px solid var(--line);padding:0 12px;height:42px}
.search:focus-within{border-color:var(--lime)}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:400 15px var(--f-mono);outline:none}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn,.seg button{font:600 13.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border:1px solid var(--line);color:var(--muted);background:var(--panel-solid)}
.chip-btn:hover,.seg button:hover{color:var(--text);border-color:var(--line-2)}
.chip-btn[aria-pressed="true"],.seg button[aria-pressed="true"]{color:var(--lime-ink);background:var(--lime);border-color:var(--lime)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font-size:15px;padding:9px 13px}
.group{display:flex;align-items:center;gap:10px;font:400 12px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:18px 12px 6px}
.group::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;column-gap:10px;width:100%;padding:9px 12px;text-align:left}
.row:hover{background:var(--hover)}
.row .num{font:400 24px/1 var(--f-mono);color:var(--lime-2);font-variant-numeric:tabular-nums}
.row .nm{font:700 23px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;min-width:0}
.row .nm small{display:block;font:400 12.5px/1.4 var(--f-mono);color:var(--muted);text-transform:none;letter-spacing:0;margin-top:3px}
.row .side{display:grid;justify-items:end;gap:5px}
.row[aria-current="true"]{background:var(--band)}
.row[aria-current="true"] .num{font-size:34px;color:var(--lime)}
.row[aria-current="true"] .nm{color:var(--lime-2)}
.row[aria-current="true"] .nm small{color:var(--text)}
.star{color:var(--lime);font-size:.72em;margin-left:7px;vertical-align:.12em}
.empty{padding:22px 12px;color:var(--muted);font-size:14px}

/* Tier-Pips wie im Spiel */
.pips{display:inline-flex;gap:3px;align-items:center}
.pips i{width:9px;height:9px;background:var(--gold);display:block}
.pips i.off{background:var(--pip-off)}
.pips b{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--orange);margin-left:6px;display:block}
.tier-txt{font:400 11px/1 var(--f-mono);color:var(--muted)}

/* Detailkarte */
.card{background:var(--panel-a);border:1px solid var(--line)}
.wd-head{padding:18px 20px 16px;border-bottom:1px solid var(--line);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 9px)}
.wd-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.label{font:600 13px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.wd-class{font:400 15px/1.3 var(--f-mono);color:var(--lime-2);margin-top:14px}
.wd-name{font:800 clamp(40px,6vw,68px)/.9 var(--f-display);text-transform:uppercase;margin:6px 0 0;letter-spacing:.005em;overflow-wrap:anywhere}
.wd-en{font:400 13px var(--f-mono);color:var(--dim);margin-top:6px}
.wd-meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:14px;font:400 13px var(--f-mono);color:var(--muted)}
.wd-meta b{color:var(--text);font-weight:400}
.flag{color:var(--orange)}
.lvlmini{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.lvlmini svg{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2}
.minibar{width:110px;height:3px;background:var(--pip-off);display:block}
.minibar i{display:block;height:100%;background:var(--text)}
.wd-body{padding:2px 20px 20px}
.block{padding-block:18px;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.block h3{margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font:700 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0}
.stat{background:var(--panel-solid);padding:10px 12px;min-width:0}
.stat dt{font:400 11px/1.25 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat dd{margin:6px 0 0;font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat dd small{font:500 13px var(--f-body);color:var(--muted);margin-left:4px}
.stat .sub{display:block;font:400 11px/1.35 var(--f-mono);color:var(--sub);margin-top:5px}
.stat.gap dd{color:var(--dim)}
.stat.warn .sub{color:var(--orange)}

.src{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font:400 12px/1.5 var(--f-mono);color:var(--muted)}
.k{font:400 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border:1px solid currentColor;white-space:nowrap}
.k-hoch{color:var(--lime)} .k-mittel{color:var(--gold)} .k-niedrig{color:var(--orange)} .k-luecke{color:var(--dim)}
.gapbox{border:1px dashed var(--line-2);padding:14px;color:var(--muted);font-size:14px}

.bars{display:grid;gap:9px}
.bar-row,.axis{display:grid;grid-template-columns:76px minmax(0,1fr) 70px;align-items:center;gap:10px;font:400 13px var(--f-mono)}
.track{height:12px;background-color:var(--track);position:relative;display:block;
  background-image:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px calc(100% / var(--n,4)))}
.fill{position:absolute;inset:0 auto 0 0;background:var(--lime);display:block}
.val{text-align:right;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.axis{margin-top:2px}
.ticks{position:relative;height:16px;font:400 10.5px var(--f-mono);color:var(--dim)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;margin:14px 0 0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dt small{display:block;font:400 11.5px var(--f-mono);color:var(--dim)}
.kv dd{margin:0;font:400 15px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.parts{display:grid;margin-top:12px;border:1px solid var(--line)}
.part{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--line);align-items:baseline}
.part:first-child{border-top:0}
.part .slot{font:400 12px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.part .pn{font:600 16px/1.3 var(--f-body);min-width:0;overflow-wrap:anywhere}
.part .pn em{display:block;font-style:normal;font-size:13px;color:var(--lime-2);font-weight:400}
.part .wl{font:400 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.part.is-apex .slot{color:var(--orange)}
.build-note{margin:10px 0 0;font-size:14px;color:var(--muted)}

.apex-head{display:flex;gap:14px;align-items:flex-start}
.diamond{width:16px;height:16px;border:2px solid var(--orange);transform:rotate(45deg);flex:none;margin-top:7px}
.apex-name{font:700 26px/1.05 var(--f-display);text-transform:uppercase}
.apex-en{font:400 12.5px var(--f-mono);color:var(--dim);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:400 12px/1 var(--f-mono);padding:6px 8px;background:var(--panel-3)}

.lvl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.stepper{display:flex;border:1px solid var(--line-2)}
.stepper button{width:42px;font:700 22px/1 var(--f-display);background:var(--panel-3)}
.stepper button:hover{background:var(--lime);color:var(--lime-ink)}
.stepper input{width:66px;height:44px;text-align:center;background:var(--panel-solid);border:0;color:var(--text);font:400 20px var(--f-mono);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.lvl-bar{flex:1 1 160px;height:6px;background:var(--track);display:block}
.lvl-bar i{display:block;height:100%;background:var(--gold)}
.lvl-txt{flex-basis:100%;font:400 13px var(--f-mono);color:var(--muted);margin:0}
.lvl-txt b{color:var(--gold);font-weight:400}

.notes{margin:0;padding-left:18px;display:grid;gap:7px}
.notes li::marker{color:var(--lime)}
.notes.old li{color:var(--muted)}
.notes.old li::marker{color:var(--dim)}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}

/* Seiten */
.section{display:grid;gap:14px}
.section > h2{margin:0;font:700 17px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--sand);display:flex;align-items:center;gap:12px}
.section > h2::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{color:var(--muted);max-width:68ch;margin:0}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pick{display:grid;align-content:start;gap:7px;padding:14px;background:var(--panel-a);border:1px solid var(--line);text-align:left}
.pick:hover{border-color:var(--lime)}
.pick .rk{font:400 13px var(--f-mono);color:var(--lime-2)}
.pick .pn{font:800 28px/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.pick .ps{font:400 13px var(--f-mono)}
.pick .pc{font:400 12.5px var(--f-mono);color:var(--muted)}
.chart{display:grid;gap:3px}
.crow,.caxis{display:grid;grid-template-columns:minmax(118px,210px) minmax(0,1fr) 80px;gap:12px;align-items:center}
.crow{padding:6px 8px;width:100%;text-align:left}
.crow:hover{background:var(--hover)}
.crow .cn{font:700 18px/1.1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.crow .cn small{display:block;font:400 11.5px/1.4 var(--f-mono);color:var(--muted);text-transform:none}
.crow .track{height:14px}
.crow.top .fill{background:var(--gold)}
.crow .val{font:400 15px var(--f-mono);white-space:nowrap}
.caxis{padding:0 8px}
.foot{font:400 12.5px/1.6 var(--f-mono);color:var(--muted);max-width:90ch;margin:0}
.callout{border:1px solid var(--orange-line);background:var(--orange-bg);padding:12px 14px;font-size:14.5px;max-width:90ch}
.callout b{color:var(--orange);font-weight:600}
.controls{display:grid;gap:10px}
.ctl-label{font:400 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;display:block}

.tiers{border:1px solid var(--line)}
.tier-row{display:grid;grid-template-columns:190px repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.tier-row:first-child{border-top:0}
.tier-row > *{padding:10px 12px;min-width:0}
.tier-row .cls{font:700 17px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.tier-head > *{font:400 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wchip{display:inline-flex;align-items:center;gap:5px;font:600 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;padding:7px 9px;background:var(--panel-3);margin:0 5px 5px 0}
.wchip:hover{background:var(--lime);color:var(--lime-ink)}
.wchip sup{color:var(--orange);font-size:12px;line-height:0}
.hc-list{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.hc-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;background:var(--panel-solid);text-align:left;width:100%}
.hc-item:hover{background:var(--panel-3)}
.hc-item .t{font:700 21px/1.1 var(--f-display);text-transform:uppercase}
.hc-item .r{font:400 12.5px var(--f-mono);color:var(--lime-2)}
.hc-item .g{grid-column:1 / -1;color:var(--muted);font-size:14px}
.hc-item .ms{font:400 16px var(--f-mono);text-align:right}
.count-card{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding:22px;background:var(--panel-a);border:1px solid var(--line)}
.count{font:800 clamp(64px,10vw,110px)/.85 var(--f-display);color:var(--lime);font-variant-numeric:tabular-nums}
.count-txt{display:grid;gap:4px}
.count-txt b{font:700 24px/1.1 var(--f-display);text-transform:uppercase}

/* Klasseneditor */
.lo{display:grid;gap:10px}
.slotcard{display:grid;gap:6px;padding:14px 16px;background:var(--panel-a);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
button.slotcard:hover{border-color:var(--lime)}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-class{font:400 15px/1.3 var(--f-mono);color:var(--lime-2)}
.sc-name{font:700 26px/1.05 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.sc-sub{font:400 12.5px/1.4 var(--f-mono);color:var(--muted)}
.lo-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,240px);gap:10px}
.lo-col{display:grid;gap:10px;align-content:start}
.eq-name{font:700 21px/1.1 var(--f-display);text-transform:uppercase}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.streak{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.streak:first-of-type{border-top:0}
.streak span:first-child{font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.streak .cost{font:400 15px var(--f-mono);color:var(--lime-2);white-space:nowrap}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cat{padding:14px 16px}
.cat h4{margin:0 0 8px;font:700 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.cat ul{list-style:none;margin:0;padding:0;display:grid}
.cat li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line)}
.cat li:first-child{border-top:0}
.cat .cn{font:600 15px/1.3 var(--f-body)}
.cat .cn small{display:block;font:400 12px/1.4 var(--f-mono);color:var(--dim)}
.cat .cl{font:400 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.cat .note{grid-column:1 / -1;font-size:13px;color:var(--lime-2)}
.cat .meta-mark{color:var(--lime);margin-left:5px}

/* Intel */
.intel{columns:2 380px;column-gap:20px}
.intel > .card{break-inside:avoid;margin:0 0 20px;padding:18px 20px;display:grid;gap:12px}
.intel h3{margin:0;font:700 17px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.intel p{margin:0}
.intel ul{margin:0;padding-left:18px;display:grid;gap:6px}
.intel ul li::marker{color:var(--lime)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px}
.facts dt{font:400 12px/1.7 var(--f-mono);color:var(--muted);text-transform:uppercase}
.facts dd{margin:0;font:400 14px var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:11px 16px;background:var(--lime);color:var(--lime-ink)}
.btn:hover{background:var(--lime-2)}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.alt:hover{border-color:var(--lime);color:var(--lime-2)}
.hint{font:400 12.5px/1.5 var(--f-mono);color:var(--muted);margin:0}
.tl{display:grid;gap:16px}
.tl-item{display:grid;gap:6px}
.tl-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tl-date{font:400 12.5px var(--f-mono);color:var(--muted)}
.tl-title{font:700 19px/1.1 var(--f-display);text-transform:uppercase}
.tl-item ul{font-size:14px;color:var(--muted)}
.termin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.termin:first-child{border-top:0}
.termin .d{font:400 13px var(--f-mono);color:var(--muted)}
.termin .t{font:600 15px/1.3 var(--f-body)}
.termin .t small{display:block;font:400 12px var(--f-mono);color:var(--dim)}
.termin .c{font:400 13px var(--f-mono);color:var(--lime-2);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:400 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.m{font-family:var(--f-mono);white-space:nowrap}
.state{display:grid;place-content:center;gap:14px;height:100%;text-align:center;padding:24px}
.state b{font:800 34px/1 var(--f-display);text-transform:uppercase}
.state p{margin:0;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:14px;
  width:max-content;max-width:calc(100% - 32px);padding:12px 14px;background:var(--panel-3);border:1px solid var(--lime);font-size:14px;box-shadow:0 12px 40px var(--shadow)}
.toast button{font:700 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--lime-ink);background:var(--lime);padding:8px 10px;white-space:nowrap}
.toast .x{background:transparent;color:var(--muted);padding:4px 6px;font-size:18px}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:var(--nav-h)}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;gap:0;
    padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    border-right:0;border-top:1px solid var(--line);background:var(--nav-bg);backdrop-filter:blur(10px)}
  .badge{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav a{flex:1;padding:6px 2px;font-size:11px;letter-spacing:.06em}
  .nav a svg{width:24px;height:24px}
  .topbar,.main{grid-column:1}
  .topbar{padding-block:10px 12px;gap:10px}
  .status{font-size:11.5px;gap:5px}
  .status > *{padding:6px 8px}
  .status .opt{display:none}
  .split{grid-template-columns:minmax(0,1fr);position:relative}
  .list-pane{padding-right:0}
  /* Zugeklappt nur 16 px versetzt, so breit ist der Rand der App: mit 18 px ragte die Ansicht bei 320 px 2 px über die Seite */
  .detail-pane{position:absolute;inset:0;background:var(--bg);visibility:hidden;opacity:0;transform:translateX(16px);
    transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s}
  .split.is-open .detail-pane{visibility:visible;opacity:1;transform:none;transition:opacity .18s ease,transform .18s ease}
  .split.is-open .list-pane{visibility:hidden}
  .toast{bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px))}
  .lo-grid,.trio{grid-template-columns:minmax(0,1fr)}
  .tier-row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tier-row .cls{grid-column:1 / -1;padding-bottom:0}
  .tier-head{display:none}
  .tier-row .tc::before{content:attr(data-t);display:block;font:400 11px var(--f-mono);color:var(--muted);margin-bottom:6px}
}
@media (max-width:520px){
  .part{grid-template-columns:minmax(0,1fr) auto}
  .part .slot{grid-column:1 / -1}
  .wd-head,.wd-body{padding-left:14px;padding-right:14px}
  .crow,.caxis{grid-template-columns:minmax(92px,124px) minmax(0,1fr) 70px;gap:8px}
  .crow .cn{font-size:16px}
  .crow .val{font-size:13px}
  .bar-row,.axis{grid-template-columns:62px minmax(0,1fr) 60px}
  .lvlmini{margin-left:0}
}
/* Schmale Handys: S, A und B/C der Tierliste untereinander. Drei Spalten ließen bei 320 und 360 px für einen
   langen Namen wie „Kriegsherr“ zu wenig Platz, der Chip ragte über den Rand (Altbefund, behoben 01.11.2026). */
@media (max-width:399px){
  .tier-row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== Sehhilfen der Werkstatt (31.10.2026) =====
   Hoher Kontrast (data-vision="contrast", data-hc dunkel/hell), Farbenblind (cvd), Umgekehrte Farben (invert).
   Eine Wahl für alle Werkzeuge (werkstatt.darstellung), Feld „Darstellung“ unter Intel. */
.sel{justify-self:start;max-width:100%;font:600 15px/1.2 var(--f-body);color:var(--text);background:var(--panel-solid);border:1px solid var(--line-2);padding:9px 12px}
/* Hoher Kontrast dunkel: Schwarz, Schrift #E0E0E0 (15,91:1), Linien und Flächen deckend statt durchscheinend */
:root[data-vision="contrast"][data-hc="dark"]{
  --bg:#000; --bg-2:#000; --glow:#000; --panel:#000; --panel-solid:#000; --panel-3:#121212; --panel-a:#000;
  --line:#a0a0a0; --line-2:#c4c4c4;
  --text:#e0e0e0; --muted:#c4c4c4; --dim:#adadad; --sub:var(--dim);
  --lime-ink:#000; --orange:#f5822b;
  --track:#2b2b2b; --grid:#333; --hover:#1a1a1a; --pip-off:#555; --hatch:transparent;
  --orange-line:#f5822b; --orange-bg:#000; --nav-bg:#000; --shadow:transparent;
  --band:linear-gradient(#2a3308,#2a3308);
}
/* Hoher Kontrast hell: Weiß, Schrift Schwarz, Lindgrün, Gold, Orange und Stahl auf 7:1 nachgedunkelt */
:root[data-vision="contrast"][data-hc="light"]{
  color-scheme:light;
  --bg:#fff; --bg-2:#fff; --glow:#fff; --panel:#fff; --panel-solid:#fff; --panel-3:#efefef; --panel-a:#fff;
  --line:#585757; --line-2:#3a3a3a;
  --text:#000; --muted:#2b2b2b; --dim:#4a4a4a; --sub:var(--dim); --sand:#574d35;
  --lime:#495300; --lime-2:#4b5300; --lime-ink:#fff; --gold:#654a00; --orange:#7f3b00; --steel:#3e515c;
  --track:#d6d6d6; --grid:#ccc; --hover:#f2f2f2; --pip-off:#b0b0b0; --ghost:#d6d6d6; --hatch:transparent;
  --orange-line:#7f3b00; --orange-bg:#fff; --nav-bg:#fff; --shadow:transparent;
  --band:linear-gradient(#e9f2c4,#e9f2c4);
}
html[data-vision="contrast"] body{background-image:none}
/* Farbenblind: Konfidenz „hoch“ und „niedrig“ in Himmelblau und Orange (Okabe-Ito) statt Lindgrün und Orange;
   das Wort steht ohnehin dabei */
:root[data-vision="cvd"] .k-hoch{color:#56b4e9}
:root[data-vision="cvd"] .k-niedrig{color:#e8743a}
/* Umgekehrte Farben wie der Farbfilter von Windows, Bilder bleiben echt */
:root[data-vision="invert"]{filter:invert(1)}
/* Kontrast nach dem Umdrehen: Nebenschrift und Orange heller ansetzen, damit sie umgedreht 4,5:1 halten */
:root[data-vision="invert"]{--dim:#919f98; --sub:var(--dim); --orange:#ff994e}
:root[data-vision="invert"] :is(img:not([src*=".svg"]), video, [data-echt]):not([data-echt] *){filter:invert(1)}
@media print{
  :root[data-vision="invert"], :root[data-vision="invert"] :is(img:not([src*=".svg"]), video, [data-echt]):not([data-echt] *){filter:none}
}
/* Beschlag (12.11.2026): Alles mit Rahmen trägt einen eckigen Innenrahmen in der Rundung und
   vier kleine Schrauben in Weißgold, wie die Kacheln der Startseite. Licht von rechts
   oben, darum fallen die Schatten nach links unten. Der Beschlag liegt als acht
   Hintergrund-Ebenen (--beschlag: vier Schrauben, vier Linien) vor dem eigenen Grund
   jedes Bauteils. Die Namen beginnen mit bsl-, weil viele Werkzeuge --bg selbst
   für ihre Hintergrundfarbe benutzen. --bsl-i Abstand des Rahmens von der Innenkante, --bsl-g Schraubengröße,
   --bsl-a Abstand der Schraube vom Rahmen, --bsl-l Linienfarbe. Gebaut mit einbau.py. */
:root {

<script>
(() => {
'use strict';

const DATA_URL = 'daten/waffen.json';
const APP_URL = 'https://dennismit2n.github.io/mw4/';
const IS_PWA = document.documentElement.dataset.pwa === '1';
const BUILD = (document.querySelector('meta[name="mw4-build"]') || {}).content || '';
const VIEWS = {
  arsenal: { title: 'vArsenal', ghost: '무기고' },
  meta: { title: 'vMeta', ghost: '메타' },
  ttk: { title: 'vTtk', ghost: '교전' },
  klassen: { title: 'vKlassen', ghost: '장비' },
  intel: { title: 'vIntel', ghost: '정보' }
};
const RANGES = ['0–10 m', '10–40 m', '40–80 m', '80–120 m'];
const PIPS = { S: 5, A: 4, B: 3, C: 2 };
const KONF = { hoch: 'konfHoch', mittel: 'konfMittel', niedrig: 'konfNiedrig', luecke: 'konfLuecke' };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* Speicher gesperrt – App läuft trotzdem */ } }
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Sprache ---------- */
// Seit 01.11.2026 in den 14 Sprachen der Werkstatt (Texte in tools/mw4/i18n.js). Die Wahl teilt sich die App mit der
// Startseite (gleicher Ursprung, dennismit2n-home.lang), sonst gilt die erste Browsersprache mit eigenem Block, sonst
// Englisch wie auf der Startseite. Handbuch-Texte aus den Daten bleiben Deutsch und tragen dann lang="de".
const I18N = MW4_I18N;
const LANG_KEY = 'dennismit2n-home.lang';
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function detectLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (s && own(I18N, s)) return s; } catch (e) { /* Speicher gesperrt */ }
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const c of list) { const k = String(c).toLowerCase().split(/[-_]/)[0]; if (own(I18N, k)) return k; }
  return 'en';
}
let LANG = detectLang(), plural = null;
const L = () => I18N[LANG];
const LOC = () => L()._loc;
const isDe = () => LANG === 'de';
const fill = (s, v) => v ? String(s).replace(/\{(\w+)\}/g, (m, k) => own(v, k) ? String(v[k]) : m) : s;
function entry(key) { return own(L(), key) ? L()[key] : own(I18N.en, key) ? I18N.en[key] : own(I18N.de, key) ? I18N.de[key] : key; }

  const e = entry(key);
  if (!plural) plural = new Intl.PluralRules(LOC());
  return fill(typeof e === 'object' ? (e[plural.select(n)] || e.other) : e, Object.assign({ n }, v));
}
// Handbuch-Texte bleiben Deutsch (Dennis' Wahl 01.11.2026): in fremder Oberfläche fürs Vorleseprogramm markieren
const DE = () => isDe() ? '' : ' lang="de"';
const deSpan = h => isDe() ? h : `<span lang="de">${h}</span>`;
// Namen von Waffen, Apex, Extras, Ausrüstung, Abschussserien: de deutsch, sonst englisch
const nm = x => !x ? '' : isDe() ? x.de : (x.en || x.de);
// Kurze Begriffe aus den Daten (Feuerart, Build-Titel, Rollen …): de zeigt die Daten, sonst die Liste der Sprache
const term = (map, v) => isDe() || v == null ? v : ((L()[map] || {})[v] || v);
// Slots wie im englischen Spiel; das Glossar der Daten kennt fast alle, „Aufsatz“ steht dort nicht
const SLOT_EN = { Aufsatz: 'Attachment' };
const slotName = s => isDe() ? s : (SLOT_EN[s] || S.glossDe.get(s) || s);
// Erklärung der Gesamt-TTK (Messvorschrift, also Bedienung): eine Zeile je Sprache statt einer Liste
const gesamtExpl = () => isDe() ? S.data.gesamtTtk.erklaerung : (L().gesamt || S.data.gesamtTtk.erklaerung);

const num = (v, d = 0) => v == null ? '—' : new Intl.NumberFormat(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const pct = v => isDe() ? num(v, 1) + ' %' : new Intl.NumberFormat(LOC(), { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(v / 100);
const pad = i => String(i).padStart(2, '0');
const isoDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const dateDE = iso => { if (isDe()) { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; } return isoDate(iso).toLocaleDateString(LOC(), { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const midnight = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const daysUntil = iso => Math.round((isoDate(iso) - midnight()) / 86400000);
const fmtBuild = b => { const d = new Date(b); return isNaN(d) ? '' : t('buildTime', { d: d.toLocaleDateString(LOC(), { day: '2-digit', month: '2-digit', year: 'numeric' }), t: d.toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' }) }); };
const desktop = window.matchMedia('(min-width: 900px)');
const isDesktop = () => desktop.matches;

const S = {
  data: null, byId: new Map(), klassen: new Map(), topSet: new Set(), glossDe: new Map(),
  view: 'arsenal', weapon: 'han-86', loadout: null, open: false,
  filter: LS.get('mw4.filter', 'alle'), q: '',
  metaMode: LS.get('mw4.metaMode', 'core'),
  ttkMode: LS.get('mw4.ttkMode', 'core'), ttkRange: LS.get('mw4.ttkRange', 0), ttkKlasse: LS.get('mw4.ttkKlasse', 'alle'),
  buildTab: {}, mounted: null, shownDetail: null, lastHash: null,
  reg: null, installEvt: null, lastCheck: Date.now()
};
const main = $('#main');

// Feste Texte im Markup (data-t, data-t-aria) und alles, was an der Sprache hängt
function applyStatic() {
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  $('#stLang').hidden = isDe();
  const inst = $('#stInstall'); if (inst) inst.textContent = t('install');
}
function setLang(l) {
  if (!own(I18N, l)) return;
  LANG = l; plural = null;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* Speicher gesperrt: gilt bis zum Neuladen */ }
  applyStatic();
  if (!S.data) return;
  paintStatus(); netStatus();
  S.mounted = null; S.shownDetail = null;
  render();
}
applyStatic();

/* ---------- Bausteine ---------- */
const tierLabel = t => t === 'B' ? 'B/C' : t;
const CHIP = { ar: 'Sturmgewehre', smg: 'MPs', sg: 'Schrotflinten', lmg: 'LMGs', dmr: 'DMR', sniper: 'Scharfschützen', pistole: 'Pistolen', werfer: 'Werfer', nahkampf: 'Nahkampf' };
// Waffenklassen: Mehrzahl (Gruppen), Einzahl (Unterzeilen), Filterchip
function clsName(id, form) {
  const mine = !isDe() && L().cls && L().cls[id];
  if (mine) return mine[form];
  const k = S.klassen.get(id) || {};
  return form === 2 ? (CHIP[id] || k.name || id) : form === 1 ? (k.einzahl || id) : (k.name || id);
}
const chipName = id => clsName(id, 2);
function pips(tier, apex) {
  let h = '<span class="pips"' + (tier ? ` title="${esc(t('pipsTitle', { t: tierLabel(tier) }))}"` : '') + '>';
  if (tier) for (let i = 0; i < 5; i++) h += `<i class="${i < (PIPS[tier] || 0) ? '' : 'off'}"></i>`;
  if (apex) h += `<b title="${esc(t('apexAvail'))}"></b>`;
  return h + '</span>';
}
const konf = k => `<span class="k k-${esc(k)}">${esc(KONF[k] ? t(KONF[k]) : k)}</span>`;
const gapBox = t => `<div class="gapbox">${t}</div>`;
const klasse = w => S.klassen.get(w.klasse);
const patchLabel = () => `${S.data.info.patch.name} (${dateDE(S.data.info.patch.live)})`;
const hcMs = w => w.hcModell && w.rpm ? Math.round(60000 / w.rpm + ((w.werte && w.werte.openBolt) || 0)) : null;
const getLvl = id => Math.max(0, parseInt(LS.get('mw4.lvl.' + id, 0), 10) || 0);
const sourceLinks = list => list.map(q => `<a href="${esc(q.url)}" target="_blank" rel="noopener"${DE()}>${esc(q.titel)}</a>`).join('');
function niceScale(max) {
  const step = max > 400 ? 200 : max > 200 ? 100 : 50;
  const top = Math.max(step, Math.ceil(max / step) * step);
  const ticks = []; for (let t = 0; t <= top; t += step) ticks.push(t);
  return { top, ticks, n: ticks.length - 1 };
}
const ticksHtml = (sc, unit) => `<div class="ticks">${sc.ticks.map(t => `<span style="left:${t / sc.top * 100}%">${t}${t === sc.top ? ' ' + unit : ''}</span>`).join('')}</div>`;

/* ---------- Navigation ---------- */
function go(hash, push) {
  try {
    if (push) history.pushState({ rk: 1 }, '', '#' + hash);
    else history.replaceState(history.state, '', '#' + hash);
  } catch (e) { location.hash = hash; return; }
  route();
}
function back() {
  if (history.state && history.state.rk) { history.back(); return; }
  go(S.view === 'klassen' ? 'klassen' : 'arsenal', false);
}
function openWeapon(id, fromList) {
  if (!S.byId.has(id)) return;
  go('w-' + id, !(fromList && isDesktop()));
}
function openLoadout(id, fromList) { go('k-' + id, !(fromList && isDesktop())); }

function route() {
  if (!S.data) return;
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  S.lastHash = location.hash;
  let view = 'arsenal', open = false;
  if (h.startsWith('w-') && S.byId.has(h.slice(2))) { S.weapon = h.slice(2); open = true; }
  else if (h.startsWith('k-') && (h.slice(2) === 'katalog' || S.data.loadouts.some(l => l.id === h.slice(2)))) { view = 'klassen'; S.loadout = h.slice(2); open = true; }
  else if (VIEWS[h]) view = h;
  S.view = view; S.open = open;
  render();
}

/* ---------- Rendern ---------- */
function render() {
  $$('[data-nav]').forEach(a => a.setAttribute('aria-current', a.dataset.nav === S.view ? 'page' : 'false'));
  $('#viewTitle').textContent = t(VIEWS[S.view].title);
  // Der koreanische Untertitel ist Deko; in der koreanischen Oberfläche stünde dasselbe Wort zweimal da
  $('#viewGhost').textContent = LANG === 'ko' ? '' : VIEWS[S.view].ghost;
  $('#backBtn').hidden = !(S.open && !isDesktop());
  if (S.mounted !== S.view) {
    S.mounted = S.view; S.shownDetail = null;
    ({ arsenal: mountArsenal, meta: renderMeta, ttk: renderTtk, klassen: mountKlassen, intel: renderIntel })[S.view]();
  }
  if (S.view === 'arsenal') updateArsenal();
  if (S.view === 'klassen') updateKlassen();
}
function rerenderPage(fn) {
  const p = $('#page'); const top = p ? p.scrollTop : 0;
  fn();
  const np = $('#page'); if (np) np.scrollTop = top;
}

/* ===== Arsenal ===== */
function mountArsenal() {
  const chips = [{ id: 'alle', name: t('all') }].concat(S.data.waffenklassen.map(k => ({ id: k.id, name: chipName(k.id) })));
  main.innerHTML = `
    <div class="split" id="split">
      <section class="pane list-pane" aria-label="${esc(t('listAria'))}">
        <div class="tools">
          <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>

          <div class="chips" role="group" aria-label="${esc(t('chipsAria'))}">${chips.map(c => `<button type="button" class="chip-btn" data-filter="${c.id}" aria-pressed="${S.filter === c.id}">${esc(c.name)}</button>`).join('')}</div>

}
function matches(w, q) {
  if (!q) return true;

  const hay = [w.name.de, w.name.en, k.name, k.einzahl, k.en, clsName(k.id, 0), clsName(k.id, 1), w.apex && w.apex.name.de, w.apex && w.apex.name.en].join(' ').toLowerCase();

}
function renderRows() {

      last = k.id;

    }

    const sub = [clsName(k.id, 1), w.rpm ? num(w.rpm) + ' RPM' : null, w.ttk && w.ttk.core && w.ttk.core[0] ? 'TTK ' + w.ttk.core[0] + ' ms' : null].filter(Boolean).map(x => x.replace(/ /g, ' ')).join(' · ');
    h += `<button type="button" class="row" data-weapon="${w.id}" data-from="list" aria-current="${w.id === S.weapon}">
      <span class="num">${pad(i)}</span>
      <span class="nm">${esc(nm(w.name))}${S.topSet.has(w.id) ? `<span class="star" aria-label="${esc(t('topPick'))}">★</span>` : ''}<small>${esc(sub)}</small></span>
      <span class="side">${pips(w.tier, !!w.apex)}${w.tier ? `<span class="tier-txt">${esc(t('tierT', { t: tierLabel(w.tier) }))}</span>` : ''}</span>
    </button>`;
  }
  $('#rows').innerHTML = h || `<p class="empty">${esc(t('noWeapon', { q: S.q }))}</p>`;
}
function updateArsenal() {
  $$('#rows .row').forEach(r => r.setAttribute('aria-current', String(r.dataset.weapon === S.weapon)));
  $('#split').classList.toggle('is-open', S.open);
  if (S.shownDetail !== S.weapon) {
    const d = $('#detail');
    d.innerHTML = weaponHtml(S.byId.get(S.weapon));

    const row = $(`#rows .row[data-weapon="${S.weapon}"]`);
    if (row && isDesktop()) row.scrollIntoView({ block: 'nearest' });
  }
}
function refreshDetail() {
  const d = $('#detail'); if (!d) return;
  const top = d.scrollTop; d.innerHTML = weaponHtml(S.byId.get(S.weapon)); d.scrollTop = top;
}

function cell(label, val, unit, sub, cls) {
  const has = val != null && val !== '';
  return `<div class="stat ${has ? '' : 'gap'} ${cls || ''}"><dt>${label}</dt><dd>${has ? val : '—'}${has && unit ? `<small>${unit}</small>` : ''}</dd>${sub ? `<span class="sub">${sub}</span>` : (has ? '' : `<span class="sub">${esc(t('noMeasure'))}</span>`)}</div>`;
}
function statsHtml(w) {
  const v = w.werte || {}, f = w.freischaltung;
  const minor = w.klasse === 'werfer' || w.klasse === 'nahkampf';
  const cells = [];
  const lbl = k => esc(t(k));
  if (w.rpm != null) cells.push(cell(lbl('sFireRate'), num(w.rpm), 'RPM', w.feuerart && esc(term('feuer', w.feuerart))));
  if (w.magazin != null) cells.push(cell(lbl('sMag'), `${w.magazin} / ${w.reserve}`, '', lbl('sMagSub')));

  cells.push(cell(lbl('sMaxLevel'), w.maxLevel, '', w.apex ? lbl('sWeaponLevelApex') : lbl('sWeaponLevel')));

    cells.push(cell(lbl('sSprintFire'), v.stf, 'ms', v.stfBuild ? esc(t('withMetaBuildMs', { v: v.stfBuild })) : null));

    cells.push(cell(lbl('sVelocity'), gv, 'm/s', v.geschoss != null ? (v.geschossBuild ? esc(t('withBuildMs', { v: v.geschossBuild })) : null) : (v.geschossBuild ? lbl('withMetaBuild') : null)));
    const bw = v.bewegung != null ? v.bewegung : v.bewegungBuild;
    if (bw != null) cells.push(cell(lbl('sMove'), num(bw, 2), 'm/s', v.bewegung != null ? null : lbl('withMetaBuild')));
    if (v.sprint != null) cells.push(cell(lbl('sSprint'), num(v.sprint, 2), 'm/s'));
    if (v.rueckH != null) cells.push(cell(lbl('sRecoil'), `${num(v.rueckH, 1)} / ${num(v.rueckV, 1)}`, '', lbl('sRecoilSub')));
    if (v.kopf != null) cells.push(cell(lbl('sHead'), '×' + num(v.kopf, 1), ''));
    if (v.openBolt != null) cells.push(cell(lbl('sOpenBolt'), v.openBolt, 'ms', lbl('sOpenBoltSub')));
    if (w.ttk && w.ttk.abfall) cells.push(cell(lbl('sFalloff'), esc(w.ttk.abfall), '', lbl('sFalloffSub')));
  }
  const src = minor
    ? `<div class="src">${esc(t('srcBlog'))} ${konf('hoch')}</div>`
    : `<div class="src">${esc(t('srcBlogFull'))} ${konf('hoch')}</div>
       <div class="src">${esc(t('srcHandling', { s: v.quelle || '—' }))} · ${esc(patchLabel())} ${konf(v.konfidenz || 'luecke')}</div>`;
  return `<section class="block"><h3>${esc(t('hValues'))}</h3><dl class="stats">${cells.join('')}</dl>${src}</section>`;
}
function ttkHtml(w) {

}

function setLvl(v) {
  const w = S.byId.get(S.weapon); if (!w) return;
  const lvl = Math.max(0, Math.min(w.maxLevel, parseInt(v, 10) || 0));
  LS.set('mw4.lvl.' + w.id, lvl);
  const inp = $('#lvlInput'); if (inp && String(inp.value) !== String(lvl) && document.activeElement !== inp) inp.value = lvl;
  const share = lvl / w.maxLevel * 100;
  $$('.lvl-bar i, #lvlMini .minibar i').forEach(i => { i.style.width = share + '%'; });
  const mini = $('#lvlMini span'); if (mini) mini.textContent = `${lvl} / ${w.maxLevel}`;
  $('#lvlTxt').innerHTML = lvlText(w, lvl);
}

function pickCard(id, i) {

function barChart(rows, unit, opts = {}) {
  if (!rows.length) return gapBox(esc(t('noValues')));

  const fmt = opts.fmt || (v => `${num(v)} ${unit}`);
  return `<div class="chart">${rows.map((r, i) => `<button type="button" class="crow ${i < (opts.top || 0) ? 'top' : ''}" data-weapon="${r.id}">
      <span class="cn">${esc(r.name)}<small>${esc(r.sub || '')}</small></span>
      <span class="track" style="--n:${sc.n}"><span class="fill" style="width:${r.v / sc.top * 100}%"></span></span>
      <span class="val">${opts.prefix || ''}${fmt(r.v)}</span></button>`).join('')}
    <div class="caxis"><span></span>${ticksHtml(sc, unit)}<span></span></div></div>`;
}

/* ===== TTK ===== */
function renderTtk() {
  const mode = S.ttkMode;
  const modes = [['core', t('mStandard')], ['hc', t('mHc')], ['gesamt', t('mTotal')], ['kopf', t('mHead')]];
  let rows = [];
  if (mode === 'core') rows = S.data.waffen.filter(w => w.ttk && w.ttk.core && w.ttk.core[S.ttkRange] != null).map(w => ({ w, v: w.ttk.core[S.ttkRange] }));
  else if (mode === 'hc') rows = S.data.waffen.filter(w => hcMs(w)).map(w => ({ w, v: hcMs(w) }));
  else if (mode === 'gesamt') rows = S.data.gesamtTtk.werte.map(x => ({ w: S.byId.get(x.id), v: x.ms, label: x.label }));
  else rows = S.data.waffen.filter(w => w.ttk && w.ttk.kopfZuerst15).map(w => ({ w, v: w.ttk.kopfZuerst15 }));
  const avail = [...new Set(rows.map(r => r.w.klasse))];
  const kl = avail.includes(S.ttkKlasse) ? S.ttkKlasse : 'alle';
  rows = rows.filter(r => kl === 'alle' || r.w.klasse === kl).sort((a, b) => a.v - b.v)
    .map(r => ({ id: r.w.id, name: r.label || nm(r.w.name), v: r.v, sub: clsName(r.w.klasse, 1) + (mode === 'hc' && r.w.werte.openBolt ? ' · ' + t('inclBolt', { n: r.w.werte.openBolt }) : '') + (mode !== 'hc' && r.w.rpm ? ' · ' + num(r.w.rpm) + ' RPM' : '') }));
  const foot = {
    core: `${esc(t('ttkFootCore', { d: dateDE('2026-10-23') }))} ${konf('mittel')}<br>${deSpan(TXT_TTK_CORE)}`,
    hc: `${deSpan(esc(S.data.info.texte.hardcore[0]))}<br>${deSpan(esc(S.data.info.texte.hardcore[1]))} ${konf('niedrig')}`,
    gesamt: `${t('ttkFootTotal', { s: deSpan(esc(S.data.gesamtTtk.quelle)), e: esc(gesamtExpl()) })} ${konf('mittel')}<br>${deSpan(TXT_TTK_TOTAL)}`,
    kopf: `${esc(t('ttkFootHead', { d: dateDE('2026-10-22') }))} ${konf('mittel')}`
  }[mode];
  const klChips = [['alle', t('all')]].concat(avail.map(id => [id, chipName(id)]));
  main.innerHTML = `<div class="page" id="page"><div class="page-inner">
    <div class="controls">
      <div><span class="ctl-label">${esc(t('measure'))}</span><div class="seg" role="group" aria-label="${esc(t('measure'))}">${modes.map(([id, l]) => `<button type="button" data-ttk-mode="${id}" aria-pressed="${mode === id}">${esc(l)}</button>`).join('')}</div></div>
      ${mode === 'core' ? `<div><span class="ctl-label">${esc(t('distance'))}</span><div class="seg" role="group" aria-label="${esc(t('distance'))}">${RANGES.map((r, i) => `<button type="button" data-ttk-range="${i}" aria-pressed="${S.ttkRange === i}">${r}</button>`).join('')}</div></div>` : ''}
      ${avail.length > 1 ? `<div><span class="ctl-label">${esc(t('klasse'))}</span><div class="chips" role="group" aria-label="${esc(t('klasse'))}">${klChips.map(([id, l]) => `<button type="button" class="chip-btn" data-ttk-klasse="${id}" aria-pressed="${kl === id}">${esc(l)}</button>`).join('')}</div></div>` : ''}
    </div>
    <section class="section"><h2>${esc(t('fastestFirst', { m: mode === 'core' ? t('mStandard') + ' · ' + RANGES[S.ttkRange] : modes.find(x => x[0] === mode)[1] }))}</h2>
      ${barChart(rows, 'ms', { top: 3, prefix: mode === 'hc' ? '≈ ' : '' })}
      <p class="foot">${foot}</p></section>
  </div></div>`;
}

  }).join('');
  const n = S.data.loadouts.length + 1;
  main.innerHTML = `<div class="split" id="split">
    <section class="pane list-pane" aria-label="${esc(t('classesAria'))}">
      <div class="group">${esc(t('recClasses', { n: S.data.loadouts.length }))}</div>${items}
      <div class="group">${esc(t('lookup'))}</div>
      <button type="button" class="row" data-loadout="katalog" data-from="list" aria-current="${S.loadout === 'katalog'}"><span class="num">${pad(n)}</span><span class="nm">${esc(t('catalog'))}<small>${esc(t('catalogSub'))}</small></span><span class="side"></span></button>
    </section>
    <section class="pane detail-pane" id="detail" aria-label="${esc(t('classDetails'))}"></section></div>`;
}
function updateKlassen() {
  $$('.list-pane .row').forEach(r => r.setAttribute('aria-current', String(r.dataset.loadout === S.loadout)));
  $('#split').classList.toggle('is-open', S.open);
  if (S.shownDetail !== S.loadout) {
    const d = $('#detail');
    d.innerHTML = S.loadout === 'katalog' ? katalogHtml() : loadoutHtml(S.data.loadouts.find(l => l.id === S.loadout));
    d.scrollTop = 0; S.shownDetail = S.loadout;

/* ===== Darstellung ===== */
// Sehhilfen der Werkstatt (31.10.2026): Die Wahl gilt in allen Werkzeugen auf dennismit2n.github.io
// (werkstatt.darstellung, roher Text). Die Rüstkammer hat nur ein dunkles Thema, deshalb fünf Einträge:
// Hell, Dunkel und System der anderen Werkzeuge zählen hier als „Normal“. Farbenblind merkt sich hell
// oder dunkel nach dem Gerät, damit die anderen Werkzeuge passend weitermachen.
const VISION_KEY = 'werkstatt.darstellung';
const VISION_OPTIONS = [['normal', 'vNormal'], ['hc-dark', 'vHcDark'], ['hc-light', 'vHcLight'], ['cvd', 'vCvd'], ['invert', 'vInvert']];
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
function storedVision() { try { return localStorage.getItem(VISION_KEY) || 'system'; } catch (e) { return 'system'; } }
function visionOption(v = storedVision()) {
  if (v === 'hc-dark' || v === 'hc-light' || v === 'invert') return v;
  if (v === 'cvd-dark' || v === 'cvd-light') return 'cvd';
  return 'normal';
}
function applyVision(v = storedVision()) {
  const r = document.documentElement;
  let hc = null;
  r.removeAttribute('data-vision'); r.removeAttribute('data-hc');
  if (v === 'hc-dark' || v === 'hc-light') hc = v.slice(3);
  else if (v === 'system' && mq('(prefers-contrast: more)')) hc = mq('(prefers-color-scheme: dark)') ? 'dark' : 'light';
  if (hc) { r.setAttribute('data-vision', 'contrast'); r.setAttribute('data-hc', hc); }
  else if (v === 'cvd-dark' || v === 'cvd-light') r.setAttribute('data-vision', 'cvd');
  else if (v === 'invert') r.setAttribute('data-vision', 'invert');
  const sel = $('#visionSel');
  if (sel) sel.value = visionOption(v);
}
function setVision(option) {
  const now = storedVision();
  let next = option;
  if (option === 'normal') next = visionOption(now) === 'normal' ? now : 'system';
  else if (option === 'cvd') next = visionOption(now) === 'cvd' ? now : (mq('(prefers-color-scheme: dark)') ? 'cvd-dark' : 'cvd-light');
  try { localStorage.setItem(VISION_KEY, next); } catch (e) { /* Speicher gesperrt: gilt bis zum Neuladen */ }
  applyVision(next);
}
document.addEventListener('change', e => {
  if (e.target.id === 'visionSel') setVision(e.target.value);
  if (e.target.id === 'langSel') setLang(e.target.value);
});
// „System“ folgt dem Gerät live, auch bei „Kontrast erhöhen“; eine Wahl in einem anderen Werkzeug gilt sofort
['(prefers-color-scheme: dark)', '(prefers-contrast: more)'].forEach(q => { if (window.matchMedia) window.matchMedia(q).addEventListener('change', () => applyVision()); });
window.addEventListener('storage', e => {
  if (e.key === VISION_KEY) applyVision();
  // Sprache auf der Startseite oder im Vault-Handbuch umgestellt: hier gleich mitziehen
  if (e.key === LANG_KEY && e.newValue && e.newValue !== LANG && own(I18N, e.newValue)) setLang(e.newValue);
});
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;
  applyVision();
  const l = detectLang(); if (l !== LANG) setLang(l);
});

async function fetchData(fresh) {
  const r = await fetch(DATA_URL + (fresh ? '?t=' + Date.now() : ''), { cache: fresh ? 'no-store' : 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function applyData(d) {
  S.data = d;
  S.byId = new Map(d.waffen.map(w => [w.id, w]));
  S.klassen = new Map(d.waffenklassen.map(k => [k.id, k]));
  S.topSet = new Set(d.metaBericht.core.top);
  S.glossDe = new Map((d.glossar || []).map(g => [g.de, g.en]));
  if (!S.byId.has(S.weapon)) S.weapon = d.waffen[0].id;
  if (S.filter !== 'alle' && !S.klassen.has(S.filter)) S.filter = 'alle';
  paintStatus();
}
function announceVersion() {
  const v = S.data.info.datenVersion, a = S.data.info.aenderungen[0];
  const lastV = LS.get('mw4.seenVersion', null), lastB = LS.get('mw4.build', null);
  const dataNews = lastV && lastV !== v && a ? ' ' + t('newData', { t: a.text }) : '';
  if (BUILD && lastB && lastB !== BUILD) setTimeout(() => toast(t('updatedTo', { d: fmtBuild(BUILD) }) + dataNews), 600);
  else if (dataNews) setTimeout(() => toast(dataNews.trim()), 600);
  if (BUILD) LS.set('mw4.build', BUILD);
  LS.set('mw4.seenVersion', v);
}
const offerReload = build => toast(t('newVersion', { d: fmtBuild(build) }), t('reload'), () => location.reload());
async function checkUpdates(manual) {
  S.lastCheck = Date.now();
  const hint = () => { const h = $('#updHint'); if (h) h.textContent = installHint(); };
  if (manual) { const h = $('#updHint'); if (h) h.textContent = t('searching'); }
  try {
    if (S.reg) S.reg.update().catch(() => {});
    if (IS_PWA && BUILD) {
      const r = await fetch('version.json', { cache: 'no-store' });
      const v = r.ok ? await r.json() : null;
      if (v && v.build && v.build !== BUILD) { offerReload(v.build); hint(); return; }
    } else {
      const d = await fetchData(true);
      if (d.info.datenVersion !== S.data.info.datenVersion) { applyData(d); S.mounted = null; route(); announceVersion(); hint(); return; }
    }
    if (manual) toast(t('upToDate', { v: S.data.info.datenVersion }));
  } catch (e) {
    if (manual) toast(t('offlineNow'));
  }
  hint();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.data) return;
  if (IS_PWA || Date.now() - S.lastCheck > 30 * 60 * 1000) checkUpdates(false);
});

function registerSW() {
  if (!IS_PWA || !window.isSecureContext) return;
  let sw;
  try { sw = navigator.serviceWorker; } catch (e) { return; }
  if (!sw) return;
  sw.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    S.reg = reg;
    reg.update().catch(() => {});
    if (S.view === 'intel') { const h = $('#updHint'); if (h) h.textContent = installHint(); }
  }).catch(() => {});
  /* Neue Version, während die App offen war: anbieten statt hart neu zu laden */
  sw.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'mw4-updated' && d.version && BUILD && d.version !== BUILD) offerReload(d.version);
  });
}

  if (!S.installEvt) return;
  S.installEvt.prompt();
  try { await S.installEvt.userChoice; } catch (e) { /* abgebrochen */ }
  S.installEvt = null; const b = $('#stInstall'); if (b) b.remove();
  if (S.view === 'intel') rerenderPage(renderIntel);
}

async function boot() {
  tickClock(); setInterval(tickClock, 15000);
  netStatus(); window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus);
  registerSW();
  try {
    applyData(await fetchData(false));
  } catch (e) {
    main.innerHTML = `<div class="state"><b>${esc(t('dataErr'))}</b><p>${t('dataErrText', { e: esc(e.message) })}</p><div class="btns" style="justify-content:center"><button type="button" class="btn" id="retryBtn">${esc(t('retry'))}</button></div></div>`;
    return;
  }
  route();
  announceVersion();
}
boot();
})();
</script>
</body>
